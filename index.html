<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>VORTEX Cut — Переход в студию...</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #07080c;
      color: #f3f5fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      width: 100%;
      max-width: 340px;
      background: #101219;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }
    .spin {
      width: 34px;
      height: 34px;
      margin: 0 auto 14px;
      border-radius: 50%;
      border: 3px solid rgba(0, 229, 255, 0.2);
      border-top-color: #00e5ff;
      animation: sp 0.8s linear infinite;
    }
    @keyframes sp { to { transform: rotate(360deg); } }
    h1 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 13px; color: #94a3b8; line-height: 1.45; }
    .btn {
      display: none;
      margin: 16px auto 0;
      width: 100%;
      height: 42px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #00e5ff, #7c3aed);
      color: #fff;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spin" id="spin"></div>
    <h1 id="ttl">Подключаемся к студии...</h1>
    <p id="sub">Открываем видеоредактор</p>
    <button class="btn" id="retryBtn" type="button">Попробовать снова</button>
  </div>

  <script>
    (() => {
      "use strict";
      const DEFAULT_GIST_ID = "28cc9da0a82e8e1c1c73e0c6286499b1";
      const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

      function enforceFullscreen() {
        if (!tg) return;
        try {
          tg.ready();
          tg.expand();
          if (typeof tg.disableVerticalSwipes === "function") tg.disableVerticalSwipes();
          if (typeof tg.setHeaderColor === "function") tg.setHeaderColor("#07080c");
          if (typeof tg.setBackgroundColor === "function") tg.setBackgroundColor("#07080c");
        } catch (e) { }
      }
      enforceFullscreen();

      function showOffline(msg) {
        const sp = document.getElementById("spin");
        const ttl = document.getElementById("ttl");
        const sub = document.getElementById("sub");
        const btn = document.getElementById("retryBtn");
        if (sp) sp.style.display = "none";
        if (ttl) ttl.textContent = "Сервер сейчас на паузе";
        if (sub) sub.textContent = msg || "Возможно, отключили свет или интернет. Попробуйте через пару минут.";
        if (btn) btn.style.display = "block";
      }

      async function fetchWithTimeout(url, ms) {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), ms);
        try {
          return await fetch(url, { cache: "no-store", signal: ctrl.signal });
        } finally {
          clearTimeout(t);
        }
      }

      async function go() {
        enforceFullscreen();
        const sp = document.getElementById("spin");
        const btn = document.getElementById("retryBtn");
        const ttl = document.getElementById("ttl");
        const sub = document.getElementById("sub");
        if (sp) sp.style.display = "block";
        if (btn) btn.style.display = "none";
        if (ttl) ttl.textContent = "Подключаемся к студии...";
        if (sub) sub.textContent = "Ищем активный сервер";

        const params = new URLSearchParams(window.location.search);
        const gistId = (params.get("g") || DEFAULT_GIST_ID || "").trim();
        let utParam = (params.get("ut") || "").trim();
        try {
          if (utParam) localStorage.setItem("vortex_user_token", utParam);
          else utParam = (localStorage.getItem("vortex_user_token") || "").trim();
        } catch (e) { }

        if (!gistId) {
          showOffline("Не задан Gist ID для подключения.");
          return;
        }

        try {
          const gRes = await fetchWithTimeout(`https://api.github.com/gists/${encodeURIComponent(gistId)}?t=${Date.now()}`, 5000);
          if (!gRes.ok) throw new Error("Gist HTTP " + gRes.status);
          const gJson = await gRes.json();
          const files = gJson.files || {};
          const fileObj = files["vortex_api.json"] || Object.values(files)[0];
          const cfg = fileObj && fileObj.content ? JSON.parse(fileObj.content) : {};
          const apiBase = String(cfg.url || "").trim().replace(/\/+$/, "");
          if (!apiBase.startsWith("https://")) {
            showOffline("Сервер сейчас выключен. Попробуйте чуть позже.");
            return;
          }

          const hRes = await fetchWithTimeout(`${apiBase}/api/health?t=${Date.now()}`, 4000);
          if (!hRes.ok) throw new Error("Health HTTP " + hRes.status);

          const target = new URL(`${apiBase}/mobile`);
          const vidUrl = (params.get("url") || "").trim();
          if (vidUrl) target.searchParams.set("url", vidUrl);
          if (utParam) target.searchParams.set("ut", utParam);

          // Сохраняем Telegram hash (#tgWebAppData=...&tgWebAppVersion=...), иначе ломаются fullscreen и disableVerticalSwipes
          const hash = window.location.hash || "";
          enforceFullscreen();
          window.location.replace(target.toString() + hash);
        } catch (e) {
          showOffline("Нет связи с сервером (свет или интернет ещё не вернулись). Попробуйте через пару минут.");
        }
      }

      const retryEl = document.getElementById("retryBtn");
      if (retryEl) retryEl.addEventListener("click", go);
      go();
    })();
  </script>
</body>
</html>
